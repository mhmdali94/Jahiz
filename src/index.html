<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Meta-tag fallback for the CSP — the real, enforced copy is a
         response header (see public/.htaccess). connect-src 'none' is what
         actually matters here: it makes exfiltrating anything the client
         types physically impossible, bug or no bug. See OPTIONAL PASSWORD
         ENTRY → "Make the guarantee verifiable" in the spec. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none';"
    />
    <title>نموذج تسليم بيانات المشروع</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
