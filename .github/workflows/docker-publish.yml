name: Build and publish Docker image

# Runs on every push to main — builds the static site + nginx image (see
# Dockerfile) and pushes it to GitHub Container Registry. Watchtower on the
# deploy host (see docker-compose.yml) polls that image and restarts the
# container automatically once a new one lands, so a push here is the whole
# "deploy" step — no SSH access to the server needed from GitHub at all.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jahiz

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
