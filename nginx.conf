# Replaces public/.htaccess for the Docker deployment — nginx never reads
# .htaccess files, so that file (still present in dist/, harmless clutter)
# has no effect here. connect-src 'none' is the load-bearing part: it makes
# the browser itself refuse every fetch/XHR/WebSocket/beacon, so even a bug
# or an injected script cannot send anything out. Keep this in sync with the
# <meta> tag fallback in src/index.html and with public/.htaccess.
server {
    listen 80;
    server_name jahiz.aathrconsult.com;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none';" always;

    gzip on;
    gzip_types text/css application/javascript application/json font/woff2 font/woff;
    gzip_min_length 1024;

    # Static single-page app — no server-side routing needed, but keep
    # direct deep links (e.g. reloading mid-session) resolving to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
